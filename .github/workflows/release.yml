name: Build and Release
on:
  push: 
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract-a:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'snooker contract release'
      home_domain: 'kyungj.in'
      relative_path: contracts/snooker
      package: 'chain-snooker'
      make_target: 'build_cargo'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
  release-slicer:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'slicer contract release'
      home_domain: 'kyungj.in'
      relative_path: contracts/slicer
      package: 'chain-slicer'
      make_target: 'build_cargo'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
  release-runner:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'runner contract release'
      home_domain: 'kyungj.in'
      relative_path: contracts/runner
      package: 'chain-runner'
      make_target: 'build_cargo'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}